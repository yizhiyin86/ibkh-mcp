[project]
name = "ibkh-mcp"
version = "0.1.0"
description = "MCP server for the iBKH Neo4j knowledge graph: curated cypher tools + ad-hoc read/write."
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.2.0",
    "neo4j>=5.20",
]

[project.scripts]
ibkh-mcp = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
only-include = ["server.py"]
